rules:
  - name: velocity
    intervalSeconds: 60
    limit: 10
    strategy: average

  - name: denylist
    sourceList: redis
    ips:
      - 1.2.3.4
    cidrs:
      - 192.168.1.0/24
    strategy: override

  - name: horizontalBruteForce
    intervalSeconds: 300
    distinctAccounts: 5
    strategy: override

  - name: rateLimitFailedLogins
    threshold: 10
    rollingWindowSeconds: 600 # 10 minutes
    lockoutDurationSeconds: 900 # 15 minutes
    strategy: override

services:
  nats:
    url: "nats://localhost:4222"
    enabled: false
    threshold: 0.1
  redis:
    enabled: true
    host: localhost:6379

auth:
  enabled: true
  method: hmac
