rules:
  - name: velocity
    intervalSeconds: 60
    limit: 10
    strategy: average
   
  - name: denylist
    sourceList: redis
    ips:
      - 1.2.3.4
    cidrs:
      - 192.168.1.0/24
    strategy: override
 
  - name: horizontalBruteForce
    intervalSeconds: 300
    distinctAccounts: 5
    strategy: override

  - name: impossibleTravel
    speedKilometersPerHour: 1000
    strategy: average
 
services:
  nats:
    url: "nats://localhost:4222"
    enabled: false
    threshold: 0.1
  redis:
    enabled: true
    host: redis:6379
  geoIP:
    enabled: true
    # Currently only supporting mmdb, since maxmind dominates geolocation and has very fast lookup. Can add csv support later
    fileType: mmdb
    path: ./myfile.mmdb
    download: false
    source:
      sourceType: s3
      bucketName: mybucket
      bucketKey: myfile.mmdb

auth: 
  enabled: true
  method: jwt