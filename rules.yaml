rules:
  - name: velocity
    intervalSeconds: 60
    limit: 10
    strategy: average

  - name: denylist
    config:
      sourceList: database
      ips:
        - 1.2.3.4
      cidrs:
        - 192.168.1.0/24
      strategy: override

  - name: horizontalBruteForce
    intervalSeconds: 300
    distinctAccounts: 5
    strategy: override

  - name: impossibleTravel
    speedKilometersPerHour: 1000
    strategy: average
 
  - name: rateLimitFailedLogins
    threshold: 10
    rollingWindowSeconds: 600 # 10 minutes
    lockoutDurationSeconds: 900 # 15 minutes
    strategy: override

services:
  nats:
    url: "nats://localhost:4222"
    enabled: false
    threshold: 0.1
  redis:
    enabled: true
    host: localhost:6379
  geoIP:
    enabled: true
    # Currently only supporting mmdb, since maxmind dominates geolocation and has very fast lookup. Can add csv support later
    fileType: mmdb
    path: ./iplookup.mmdb
    download: false
    source:
      sourceType: s3
      bucketName: mybucket
      bucketKey: myfile.mmdb
  database:
    enabled: true
    type: postgres
    connection:
      host: localhost
      port: 0
      username: postgres
      password: postgres
      databaseName: rba
      sslMode: disable

eventStorage:
  enabled: true
  minScore: 0.5

auth:
  enabled: true
  method: jwt
